[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipm-mas"
version = "0.1.0"
description = "新疆棉田低空植保决策多智能体系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.33"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
geo = ["rasterio>=1.3", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = [
    "apps*",
    "agents*",
    "domain*",
    "adapters*",
    "sdk*",
    "mock*",
    "knowledge*",
    "workflows*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"